set default=0
set timeout=10

insmod all_video
insmod gfxterm
insmod png

set gfxmode=1024x768
terminal_output gfxterm

set color_normal=white/black
set color_highlight=white/dark-blue

background_image /boot/grub/grub-bg.png

# Resolve the actual kernel/initrd names (kernel version may change)
set krn=""
set krd=""
for f in /casper/vmlinuz-*; do
  if [ -z "$krn" ]; then set krn="$f"; fi
done
for f in /casper/initrd.img-*; do
  if [ -z "$krd" ]; then set krd="$f"; fi
done

if [ -z "$krn" ]; then
  set krn="/casper/vmlinuz-6.8.0-136-generic"
  set krd="/casper/initrd.img-6.8.0-136-generic"
fi

menuentry "Try Rayen OS" {
  linux	$krn boot=casper config boot=live components quiet splash
  initrd	$krd
}
menuentry "Try Rayen OS (safe graphics)" {
  linux	$krn boot=casper config boot=live components quiet splash nomodeset
  initrd	$krd
}
